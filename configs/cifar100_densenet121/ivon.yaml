experiment: "cifar100_densenet121/ivon"
dataset: "cifar100"
model: "densenet121"
method: "ivon"
epochs: 200
batch_size: 128
eval_batch_size: 256
train_val_split: 0.9
learning_rate: 0.2
lr_final: 0
weight_decay: 0.0002
warmup_epochs: 5
seeds: [0,1,2]
device: "cuda"
workers: 1
eval_workers: 0
data_dir: "data"
output_dir: "outputs/cifar100_densenet121/ivon"
evaluation:
  indomain: true
  ood: true
  ood_dataset: "tinyimagenet"
  checkpoints: ["best","final"]
  ivon_mean: true
method_hparams:
  beta1: 0.9
  beta2: 0.99999
  hess_init: 0.5
  hess_approx: "price"
  ess: 45000
  mc_samples: 1
  test_repeat: 64
  rescale_lr: true

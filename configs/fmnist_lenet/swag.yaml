experiment: "fmnist_lenet/swag"
dataset: "fmnist"
model: "lenet"
method: "swag"
epochs: 100
batch_size: 128
eval_batch_size: 256
train_val_split: 0.9
learning_rate: 0.005
lr_final: 0.001
weight_decay: 0.00001
warmup_epochs: 0
seeds: [0,1,2]
device: "cuda"
workers: 1
eval_workers: 0
data_dir: "data"
output_dir: "outputs/fmnist_lenet/swag"
evaluation:
  indomain: true
  ood: true
  ood_dataset: "emnist"
  checkpoints: ["best","final"]
  ivon_mean: true
method_hparams:
  momentum: 0.9
  max_rank: 20
  swag_start: 60
  swag_freq: 1
  swag_lr: 0.005
  model_samples: 64
  sample_mode: "modelwise"

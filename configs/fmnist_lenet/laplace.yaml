experiment: "fmnist_lenet/laplace"
dataset: "fmnist"
model: "lenet"
method: "laplace"
epochs: 100
batch_size: 128
eval_batch_size: 256
train_val_split: 0.9
learning_rate: 0.005
lr_final: 0
weight_decay: 0.00001
warmup_epochs: 5
seeds: [0,1,2]
device: "cuda"
workers: 1
eval_workers: 0
data_dir: "data"
output_dir: "outputs/fmnist_lenet/laplace"
evaluation:
  indomain: true
  ood: true
  ood_dataset: "emnist"
  checkpoints: ["best","final"]
  ivon_mean: true
method_hparams:
  momentum: 0.9
  subset_of_weights: "last_layer"
  hessian_structure: "kron"
  pred_type: "glm"
  link_approx: "probit"
  n_samples: 100
  prior_precision: 0.54
  optimize_prior_precision: true
  prior_precision_method: "marglik"

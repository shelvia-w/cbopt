experiment: "cifar10_resnet20/swag"
dataset: "cifar10"
model: "resnet20"
method: "swag"
epochs: 200
batch_size: 128
eval_batch_size: 256
train_val_split: 0.9
learning_rate: 0.05
lr_final: 0.01
weight_decay: 0.0002
warmup_epochs: 0
seeds: [0,1,2]
device: "cuda"
workers: 1
eval_workers: 0
data_dir: "data"
output_dir: "outputs/cifar10_resnet20/swag"
evaluation:
  indomain: true
  ood: true
  ood_dataset: "svhn"
  checkpoints: ["best","final"]
  ivon_mean: true
method_hparams:
  momentum: 0.9
  max_rank: 20
  swag_start: 160
  swag_freq: 1
  swag_lr: 0.005
  model_samples: 64
  sample_mode: "modelwise"
